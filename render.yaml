services:
  - type: web
    name: biblioteca-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/biblioteca.db
    disk:
      name: biblioteca-data
      mountPath: /var/data
      sizeGB: 1
